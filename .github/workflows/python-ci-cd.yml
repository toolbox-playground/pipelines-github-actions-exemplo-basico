name: Python CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "python-app/**"
      - ".github/workflows/python-ci-cd.yml"

  push:
    branches:
      - main
    paths:
      - "python-app/**"
      - ".github/workflows/python-ci-cd.yml"

  workflow_dispatch:

jobs:
  gitleaks-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    needs: gitleaks-scan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: python-app
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pip-audit
        working-directory: python-app
        run: pip-audit

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: dependency-check

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: python-app
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: python-app
        run: pytest

      - name: Build package
        working-directory: python-app
        run: python -m build

  publish-package:
    name: Publish Package
    runs-on: ubuntu-latest
    needs: build-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publish dependencies
        working-directory: python-app
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        working-directory: python-app
        run: python -m build

      - name: Publish package
        working-directory: python-app
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*